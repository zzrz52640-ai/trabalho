<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaborador</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="container">

        <h1>Cadastro de Colaborador</h1>

        <p>Preencha os dados abaixo para realizar seu cadastro.</p>

        <form action="processoCadastro.php" method="POST">

            <label for="nome">Qual seu nome?: </label>
            <input type="text" id="nome" name="nome" required>

            <label for="idade">Qual sua idade?: </label>
            <input type="number" id="idade" name="idade" min="16" required>

            <label for="profissao">Do que você quer trabalhar: </label>
            <input type="text" id="profissao" name="profissao" required>

            <label for="salario">O que pretende receber?:</label>
            <input type="number" id="salario" name="salario" step="0.01" required>

            <label for="experiencia">Teve alguma experiência anterior? Se sim, o que foi?:</label>
            <textarea id="experiencia" name="experiencia" rows="6" required></textarea>

            <button type="submit">Cadastrar</button>

        </form>

    </main>

</body>
</html>
